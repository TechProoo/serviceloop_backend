services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: serviceloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviceloop_dev}
      POSTGRES_DB: serviceloop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - serviceloop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceloop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  serviceloop-data:
